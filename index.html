<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>高光时刻 · 开宝箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Lilita+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#1d5a3a}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#0b2a20}
@property --ray{syntax:'<color>';inherits:true;initial-value:#b6ff8a}
@property --main{syntax:'<color>';inherits:true;initial-value:#4fd65a}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--ink:#1A1033;--cx:50vw;--cy:46vh;--hr:120px;
  transition:--bg1 .6s,--bg2 .6s,--ray .6s,--main .6s;
  --font:'Titan One','Lilita One','ZCOOL KuaiLe',system-ui,sans-serif;--num:'Lilita One','Titan One',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0618;font-family:var(--font)}
#app{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#shake{position:absolute;inset:0}
.layer{position:absolute;inset:0;pointer-events:none}
#bg{background:radial-gradient(ellipse at var(--cx) var(--cy),var(--bg1) 0%,var(--bg2) 75%)}
.ray{position:absolute;left:var(--cx);top:var(--cy);width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;border-radius:50%;
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 18%,transparent 42%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 18%,transparent 42%);mix-blend-mode:screen}
.r1{background:repeating-conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--ray) 34%,transparent) 7deg,transparent 15deg);animation:spin 70s linear infinite}
.r2{background:repeating-conic-gradient(from 9deg,transparent 0deg,color-mix(in srgb,var(--ray) 22%,transparent) 12deg,transparent 24deg);animation:spin 45s linear infinite reverse}
.r3{background:repeating-conic-gradient(from 3deg,transparent 0deg,color-mix(in srgb,#fff 12%,transparent) 4deg,transparent 9deg);animation:spin 110s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
#curtain{opacity:0;background:linear-gradient(180deg,#2a1206 0%,#8a4a12 46%,#3a1a07 100%)}
#curtain .cl{position:absolute;left:var(--cx);top:var(--cy);width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,230,150,0) 0deg,rgba(255,230,150,.35) 30deg,rgba(255,230,150,0) 70deg,rgba(255,230,150,0) 120deg,rgba(255,220,140,.3) 160deg,rgba(255,230,150,0) 210deg,rgba(255,230,150,0) 250deg,rgba(255,240,170,.32) 290deg,rgba(255,230,150,0) 340deg);
  filter:blur(40px);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%);animation:spin 30s linear infinite}
#glow{position:absolute;left:var(--cx);top:var(--cy);width:calc(var(--hr)*3.2);height:calc(var(--hr)*3.2);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--ray) 80%,transparent) 0%,color-mix(in srgb,var(--main) 40%,transparent) 32%,transparent 66%);opacity:.55;pointer-events:none}
#beams{position:absolute;left:var(--cx);top:var(--cy);width:0;height:0;opacity:0;pointer-events:none}
.beam{position:absolute;left:-32px;bottom:0;width:64px;height:62vh;transform-origin:50% 100%;border-radius:50% 50% 30% 30%;
  background:linear-gradient(to top,color-mix(in srgb,var(--ray) 85%,transparent) 0%,color-mix(in srgb,var(--ray) 35%,transparent) 45%,transparent 100%);filter:blur(10px);mix-blend-mode:screen}
.core{position:absolute;left:-130px;top:-130px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,240,.85) 0,color-mix(in srgb,var(--ray) 50%,transparent) 30%,transparent 68%);filter:blur(6px);mix-blend-mode:screen}
canvas#gl,canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#flash{opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at var(--cx) var(--cy),rgba(255,255,245,.9) 0%,color-mix(in srgb,var(--ray) 60%,transparent) 18%,transparent 55%)}
#ui{position:absolute;inset:0;pointer-events:none}
/* nameplate */
#plate{position:absolute;left:50%;top:calc(64px + 2vh);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 26px 12px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.25)),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.05) 1px 3px),linear-gradient(180deg,var(--main),color-mix(in srgb,var(--main) 55%,#1A1033));
  border:4px solid var(--ink);box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -4px 0 rgba(0,0,0,.3),0 6px 0 var(--ink),0 10px 18px rgba(0,0,0,.4);white-space:nowrap}
#title{font-size:clamp(28px,7vw,46px);color:#fff;letter-spacing:2px;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 8px 10px rgba(0,0,0,.45);line-height:1.1}
#title span{display:inline-block}
.inlay{width:22px;height:22px;flex:none;position:relative}
.t0 .inlay{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c9d2da 25%,#6b7682 70%,#3a4048 100%);border:3px solid var(--ink)}
.t1 .inlay{transform:rotate(45deg);border:4px solid #e6eef6;outline:3px solid var(--ink);border-radius:4px;background:linear-gradient(135deg,#bff0ff,#3aa6ff 50%,#1a4fb0)}
.t2 .inlay{transform:rotate(45deg);border:4px solid #f0e6ff;outline:3px solid var(--ink);border-radius:4px;background:linear-gradient(135deg,#f6d8ff,#b45cff 50%,#5a1fa8)}
.t3 .inlay{transform:rotate(45deg);border:4px solid #ffd54a;outline:3px solid var(--ink);border-radius:3px;background:linear-gradient(135deg,#fff,#d8f6ff 40%,#8fd3ff 60%,#fff)}
.crown{position:absolute;left:50%;top:-24px;width:44px;height:28px;margin-left:-22px;display:none}
.t3 .crown{display:block}
#tier{position:absolute;left:50%;top:calc(132px + 2vh);transform:translateX(-50%);display:flex;gap:10px}
#tier i{width:18px;height:18px;transform:rotate(45deg);border:3px solid var(--ink);border-radius:4px;background:#3b3355;box-shadow:inset 2px 2px 0 rgba(255,255,255,.2)}
#tier i.on{background:var(--c);box-shadow:inset 2px 2px 0 rgba(255,255,255,.6),0 0 10px var(--c)}
#hint{position:absolute;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(20px,5vw,28px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap}
#hint b{display:inline-block}
#cards{position:absolute;inset:0}
.card{position:absolute;left:0;top:0;border-radius:16px;padding:6px;will-change:transform;
  background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,0) 35%,rgba(0,0,0,.3)),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(180deg,var(--fc1),var(--fc2));
  border:3px solid var(--ink);box-shadow:inset 2px 2px 0 rgba(255,255,255,.6),inset -2px -3px 0 rgba(0,0,0,.35),0 5px 0 var(--ink),0 10px 16px rgba(0,0,0,.45)}
.card canvas{display:block;width:100%;border-radius:10px;border:3px solid var(--ink)}
.card .qty{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--num);font-size:22px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.card .stud{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff,#9aa4ae 50%,#4a525a)}
.card.r1 .stud{border-radius:3px;transform:rotate(45deg);background:linear-gradient(135deg,#dff6ff,#3aa6ff)}
.card.r2 .stud,.card.r3 .stud{border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,#bfe9ff 50%,#fff);box-shadow:0 0 0 2px #ffd54a}
.card .ccrown{position:absolute;left:50%;top:-20px;width:34px;margin-left:-17px;display:none}
.card.r3 .ccrown{display:block}
.card.rare::before{content:'';position:absolute;inset:-8px;border-radius:22px;z-index:-1;padding:5px;
  background:conic-gradient(from var(--ang),#ff4d6d,#ffb13a,#fff35c,#4dff88,#3ad2ff,#7a5cff,#ff4dd8,#ff4d6d);filter:blur(1px) saturate(1.2);animation:rb 2s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes rb{to{--ang:360deg}}
.new{position:absolute;right:-14px;top:-14px;padding:3px 8px;border-radius:10px;font-size:16px;color:#fff;background:linear-gradient(180deg,#ff6b6b,#d61f4a);border:3px solid var(--ink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;box-shadow:0 3px 0 var(--ink);transform:rotate(14deg) scale(0)}
#panel{position:absolute;left:50%;bottom:calc(5vh + 82px);width:min(360px,88vw);transform:translateX(-50%);padding:14px 20px;border-radius:20px;opacity:0;
  background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,0) 40%,rgba(0,0,0,.25)),linear-gradient(180deg,#5a2c0c,#2d1405);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px #ffcf4a,inset 3px 3px 0 5px rgba(255,255,255,.15),0 6px 0 var(--ink),0 12px 24px rgba(0,0,0,.5);color:#fff}
#panel .name{text-align:center;font-size:26px;color:#ffe066;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;margin-bottom:6px}
#panel .row{display:flex;align-items:center;justify-content:space-between;font-size:19px;padding:5px 0;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;position:relative}
#panel .row .v{font-family:var(--num);font-size:24px;color:#fff;min-width:90px;text-align:right}
#panel .row span:first-child{flex:1}
#panel .row .up{width:78px;margin-left:10px;font-family:var(--num);font-size:19px;color:#6dff8a;opacity:0;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#act{position:absolute;left:50%;bottom:calc(5vh + env(safe-area-inset-bottom));pointer-events:auto;cursor:pointer;
  font-family:var(--font);font-size:clamp(20px,5vw,26px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;padding:12px 38px 14px;border-radius:20px;border:4px solid var(--ink);
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 40%,rgba(0,0,0,.25)),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(180deg,#ffd84a,#f08a12);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -4px 0 rgba(0,0,0,.3),0 6px 0 var(--ink),0 10px 18px rgba(0,0,0,.4)}
#act:active{filter:brightness(.92)}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:60px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;z-index:10;cursor:default}
.mbtn{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.mbtn button{font-family:var(--font);font-size:15px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;border:0;padding:6px 12px;cursor:pointer;
  background:linear-gradient(180deg,#5b4e86,#2e2650);box-shadow:inset 2px 2px 0 rgba(255,255,255,.2)}
.mbtn button.on{background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%),linear-gradient(180deg,#53d6ff,#2a7fe0)}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 4px;border-radius:18px;border:3px solid var(--ink);background:linear-gradient(180deg,#3a2f5e,#1e1838);box-shadow:inset 2px 2px 0 rgba(255,255,255,.15),0 3px 0 var(--ink);
  font-family:var(--num);font-size:19px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;min-width:90px}
.pill svg{width:30px;height:30px;flex:none}
#mute{width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 50%),linear-gradient(180deg,#ffd84a,#f08a12);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
#mute svg{width:24px;height:24px}
@media (max-width:420px){.pill{min-width:70px;font-size:16px;padding-right:8px}.mbtn button{padding:6px 8px;font-size:13px}.pill svg{width:24px;height:24px}}
@media (prefers-reduced-motion:reduce){.ray,#curtain .cl,.card.rare::before{animation-duration:400s!important}}
</style>
</head>
<body>
<div id="app">
 <div id="shake">
  <div id="bg" class="layer"><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div></div>
  <div id="curtain" class="layer"><div class="cl"></div></div>
  <div id="glow"></div>
  <div id="beams"><div class="core"></div></div>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="flash" class="layer"></div>
  <div id="ui">
   <div id="plate" class="t0"><div class="inlay"></div><div id="title"></div><div class="inlay"></div>
    <svg class="crown" viewBox="0 0 44 28"><path d="M4 24 L2 6 L13 14 L22 2 L31 14 L42 6 L40 24 Z" fill="#ffd54a" stroke="#1A1033" stroke-width="3" stroke-linejoin="round"/><path d="M6 21 H38" stroke="#c27a10" stroke-width="3"/><circle cx="22" cy="17" r="3" fill="#ff4d6d" stroke="#1A1033" stroke-width="2"/></svg></div>
   <div id="tier"><i></i><i></i><i></i><i></i></div>
   <div id="cards"></div>
   <div id="panel"><div class="name">星辉之心</div>
    <div class="row"><span>战力</span><span class="v" id="s0">0</span><span class="up" id="u0"></span></div>
    <div class="row"><span>暴击率</span><span class="v" id="s1">0</span><span class="up" id="u1"></span></div>
    <div class="row"><span>幸运值</span><span class="v" id="s2">0</span><span class="up" id="u2"></span></div></div>
   <div id="hint"></div>
   <button id="act"></button>
  </div>
 </div>
 <div id="hud">
  <div class="mbtn"><button id="mStep" class="on">逐级升级</button><button id="mDirect">直接开启</button></div>
  <div class="sp"></div>
  <div class="pill" id="pCoin"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#ffc83a" stroke="#1A1033" stroke-width="3"/><circle cx="15" cy="15" r="7" fill="none" stroke="#c27a10" stroke-width="2.5"/><path d="M8 10 A8 8 0 0 1 14 6" stroke="#fff6c0" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><span id="vCoin">0</span></div>
  <div class="pill" id="pGem"><svg viewBox="0 0 30 30"><path d="M8 5 H22 L28 12 L15 27 L2 12 Z" fill="#ff5c9a" stroke="#1A1033" stroke-width="3" stroke-linejoin="round"/><path d="M2 12 H28 M11 5 L9 12 L15 27 M19 5 L21 12 L15 27" stroke="#1A1033" stroke-width="1.5" fill="none"/><path d="M5 12 L10 6" stroke="#fff" stroke-width="2"/></svg><span id="vGem">0</span></div>
  <button id="mute" aria-label="静音"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
 </div>
</div>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= 可调参数 CONFIG ================= */
const CONFIG = {
  supersample: 1.5,        // 后期描边渲染超采样倍率
  msaa: 4,                 // 颜色缓冲多重采样数
  outlineOuter: 3.2,       // 外轮廓线宽(屏幕像素)
  outlineInner: 1.3,       // 零件交界线宽(屏幕像素)
  normalThreshold: 0.32,   // 法线差阈值(越小接缝线越多)
  depthThreshold: 0.09,    // 相对深度差阈值(放宽，避免斜面碎纹)
  idleSway: 0.55,          // 待机左右转动幅度(弧度)
  idleBob: 0.08,           // 待机上下浮动幅度
  hintEvery: 2.4,          // 待机提示抖动间隔(秒)
  jumpHeight: 1.5,         // 升级跳跃高度
  squash: 0.3,             // 挤压拉伸强度(0~0.5)
  chargeDuration: 1.1,     // 蓄力时长(秒)
  chargeShake: 1.0,        // 蓄力抖动强度
  suckRate: 90,            // 蓄力吸入粒子/秒
  tierBurst: [0.55, 0.75, 1.0, 1.45], // 各等级爆发强度倍率
  burstParticles: 120,     // 爆发基础粒子数(乘以倍率)
  shake: 16,               // 屏幕震动像素
  cameraPush: 0.12,        // 镜头前推比例
  flashMax: 0.8,           // 闪白最大强度(上限0.8)
  shockwaves: 3,           // 冲击波层数
  confetti: 70,            // 最高潮彩带数量(仅传说一次)
  orbitStars: 3,           // 揭晓星尘拖尾数量
  orbitRadius: 1.45,       // 星尘轨道半径 / 主角屏幕半径(>1.3 保证在轮廓外)
  cardStagger: 0.16,       // 卡片依次飞出间隔(秒)
  coinFly: 14,             // 每张货币卡领取时飞出的图标数
  volume: 0.6              // 主音量
};
const TEST = /[?&]test/.test(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PMUL = REDUCED ? 0.35 : 1;
if (REDUCED) { CONFIG.shake = 0; CONFIG.cameraPush *= 0.4; CONFIG.chargeShake *= 0.4; }

const INK = '#1A1033';
const TIERS = [
  {name:'普通宝箱', main:'#4fd65a', ray:'#b6ff8a', bg1:'#1f6a40', bg2:'#08241a', metal:'#9aa8b4', rivet:'#d0d8e0', gem:'#5cff7a'},
  {name:'稀有宝箱', main:'#3aa6ff', ray:'#9fe0ff', bg1:'#1d4a9a', bg2:'#081538', metal:'#d4e2f0', rivet:'#ffffff', gem:'#4dc3ff'},
  {name:'史诗宝箱', main:'#b45cff', ray:'#e6b3ff', bg1:'#55209a', bg2:'#16062e', metal:'#e0d0f5', rivet:'#fff3ff', gem:'#c46bff'},
  {name:'传说宝箱', main:'#ffc23a', ray:'#fff1a0', bg1:'#a85a12', bg2:'#2a1206', metal:'#ffcf4a', rivet:'#fff3b0', gem:'#ff4d6d'}
];
const $ = s => document.querySelector(s);
const app = $('#app'), fxC = $('#fx'), fx = fxC.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
let tier = 0, state = 'idle', mode = 'step';
const anim = {idleW:1, wiggle:0, jy:0, sx:1, sy:1, spin:0, lid:0, charge:0, glow:0, camZ:1, heroS:0, heroSpin:0.6, dust:0};
window.__dbg = {get state(){return state}, get tier(){return tier}, anim, CONFIG};

/* ================= THREE ================= */
const renderer = new THREE.WebGLRenderer({canvas:$('#gl'), alpha:true, antialias:false, premultipliedAlpha:true});
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 60);
let camBaseZ = 9.5; const CAM_Y = 2.6, CAM_TY = 0.8;

const gm = new THREE.DataTexture(new Uint8Array([95,95,95,255, 150,150,150,255, 210,210,210,255, 255,255,255,255]), 4, 1, THREE.RGBAFormat);
gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.needsUpdate = true;
const toon = (c, o={}) => new THREE.MeshToonMaterial(Object.assign({color:c, gradientMap:gm}, o));

const keyL = new THREE.DirectionalLight(0xfff1dc, 2.2); keyL.position.set(-4, 7, 6); scene.add(keyL);
const sky = new THREE.HemisphereLight(0xcfe6ff, 0x4a2a40, 1.1); scene.add(sky);
const rim = new THREE.DirectionalLight(0x4fd65a, 3.2); rim.position.set(3, 3, -6); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0x4fd65a, 1.6); rim2.position.set(-5, 1, -4); scene.add(rim2);

const matWoodA = toon('#c67c3c'), matWoodB = toon('#a9632e'), matWoodC = toon('#8a4c22');
const matMetal = toon('#9aa8b4'), matRivet = toon('#d0d8e0'), matDark = toon('#2a1630');
const matGem = toon('#5cff7a', {flatShading:true});
const innerMat = new THREE.MeshBasicMaterial({color:'#3a1d10', toneMapped:false});

    else if (p.mode === 'curve'){ p.t += dt/p.dur; const t = Math.min(1, p.t), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

let AC = null, master = null, muted = false, noiseBuf = null, lastTick = 0;
function initAudio(){ if (AC) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted?0:CONFIG.volume; const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);}catch(e){AC=null;} }
function tone(f, d, {type='sine', v=.3, to=null, at=0, attack=.005}={}){
  if (!AC) return; const t0 = AC.currentTime+at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0+d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0+attack); g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.05);
}
function noise(d, {v=.3, f=1000, to=null, at=0, type='lowpass', q=1}={}){
  if (!AC) return; if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1; }
  const t0 = AC.currentTime+at, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0); if (to) fl.frequency.exponentialRampToValueAtTime(to, t0+d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t0); s.stop(t0+d+.05);
}

      .add(()=>sparkRingAt(tx+cw/2, ty+ch/2, 14, 380, TIERS[Math.min(3,it.r+1)].ray), at+.62);
    const cnt = {v:0};
    tl.to(cnt, {v:it.n, duration:Math.min(1.1, .4+it.n/600), ease:'power2.out', onUpdate(){ const v = Math.round(cnt.v); if (q.textContent !== '×'+v){ q.textContent = '×'+v; SFX.tick(); } }}, at+.66)
      .fromTo(q, {scale:1.5}, {scale:1, duration:.4, ease:'back.out(3)'}, at+.66);
    if (it.isNew) tl.to(el.querySelector('.new'), {scale:1, rotation:14, duration:.45, ease:'back.out(4)'}, at+.8);
    el._it = it; el._c = {x:tx+cw/2, y:ty+ch/2};
    return el;
  });
  return tl;
}

/* ================= action button ================= */
let actFn = null;
gsap.set('#act', {xPercent:-50, scale:0});
function showAct(label, fn, delay=0){ const b = $('#act'); b.textContent = label; actFn = fn;
  gsap.killTweensOf(b); gsap.fromTo(b, {scale:0}, {scale:1, duration:.5, delay, ease:'back.out(3)'}); }
function hideAct(){ actFn = null; gsap.killTweensOf('#act'); gsap.to('#act', {scale:0, duration:.18, ease:'power2.in'}); }
$('#act').addEventListener('pointerdown', e=>{ e.stopPropagation(); initAudio(); if (!actFn) return; const f = actFn; actFn = null; hideAct(); f(); });

/* ================= phases ================= */
function upgrade(){
  state = 'busy'; window.__phase='busy'; stopAllShakes(); setHint('');
  const nt = tier+1, sq = CONFIG.squash;
  gsap.timeline({onComplete(){ anim.spin = 0; state = 'idle'; window.__phase='idle'; setHint(nt<3 ? '点击继续升级' : '点击开启宝箱'); startIdleLoops(); }})
    .to(anim, {sx:1+sq*.5, sy:1-sq*.6, duration:.1, ease:'power2.out'})
    .add(()=>SFX.jump())
    .to(anim, {jy:CONFIG.jumpHeight, duration:.34, ease:'power2.out'})
    .to(anim, {sx:.88, sy:1.16, duration:.12, ease:'power2.out'}, '<')
    .to(anim, {sx:1, sy:1, duration:.2}, '>')
    .to(anim, {spin:Math.PI*2, duration:.58, ease:'power2.inOut'}, .1)
    .to(anim, {keyframes:[{lid:-.35,duration:.2},{lid:0,duration:.3,ease:'bounce.out'}]}, .15)
    .add(()=>{ setTier(nt); SFX.chord(nt); flash(.45, .45); sparkRing(36, 620, TIERS[nt].ray); ring(anchor.x, anchor.y, heroR*.4, heroR*2.4, .6, TIERS[nt].main); }, .42)
    .to(anim, {jy:0, duration:.26, ease:'power2.in'}, .44)
    .to(anim, {sx:.92, sy:1.1, duration:.26, ease:'power2.in'}, '<')
    .add(()=>{ SFX.land(); shakeScreen(CONFIG.shake*.3, .25); for (let i=0;i<16*PMUL;i++){ const s = i%2?1:-1; spawn({x:anchor.x+s*heroR*rnd(.6,1), y:anchor.y+heroR*.75, vx:s*rnd(80,260), vy:rnd(-160,-40), g:500, drag:.93, life:rnd(.4,.7), size:rnd(2,3.5), color:'#fff3d0'}); } })
    .to(anim, {sx:1+sq*.8, sy:1-sq, duration:.07, ease:'power3.out'})
    .to(anim, {sx:1, sy:1, duration:.6, ease:'elastic.out(1.2,.3)'});
}
function openChest(){
  state = 'busy'; stopAllShakes(); setHint('');
  const S = CONFIG.tierBurst[tier], sq = CONFIG.squash, D = CONFIG.chargeDuration;
  gsap.timeline()
    .to(anim, {idleW:0, duration:.3, ease:'power2.inOut'})
    .add(()=>{ SFX.riser(D); window.__phase = 'charge'; })
    .to(anim, {charge:1, duration:D, ease:'power2.in', onUpdate(){
      const n = CONFIG.suckRate*PMUL/60*(1+anim.charge*2);
      for (let i=0;i<n;i++){ const a = rnd(0,7), r = heroR*rnd(2.2,3.6);
        spawn({x:anchor.x+Math.cos(a)*r, y:anchor.y+Math.sin(a)*r, mode:'suck', life:1.5, size:rnd(2,4), color:Math.random()<.5?TIERS[tier].ray:'#ffffff'}); } }})
    .to(anim, {sx:1+sq*.4, sy:1-sq*.25, duration:D*.6, ease:'power1.in'}, '<'+D*.4)
    .to(anim, {sx:1+sq*1.1, sy:1-sq*1.3, duration:.09, ease:'power4.in'})
    .add(()=>burst(S));
}
function burst(S){
  window.__phase = 'burst'; anim.charge = 0; anim.glow = 1;
  const P = CONFIG.burstParticles*S*PMUL, T0 = TIERS[tier], ax = anchor.x, ay = anchor.y;
  SFX.boom(S); flash(.35 + .2*S, .45 + .35*S); shakeScreen(CONFIG.shake*S, .45 + .25*S);
  gsap.timeline().to(anim, {camZ:1-CONFIG.cameraPush*Math.min(1.3,S), duration:.12, ease:'power3.out'}).to(anim, {camZ:1, duration:1.1, ease:'elastic.out(1,.45)'});
  gsap.timeline().to(anim, {sx:.82, sy:1.32, duration:.1, ease:'power3.out'}).to(anim, {sx:1, sy:1, duration:.8, ease:'elastic.out(1.2,.3)'});
  gsap.to(anim, {lid:-1.95, duration:.75, ease:'back.out(2.2)'});
  for (let i=0;i<CONFIG.shockwaves;i++) gsap.delayedCall(i*.09, ()=>ring(ax, ay, heroR*.3, heroR*(2.6+i*1.1)*(.8+.3*S), .7+i*.15, i%2?'#ffffff':T0.main));
  for (let i=0;i<P*.5;i++){ const a = rnd(0,7), v = rnd(700,1500)*(.8+.3*S); spawn({x:ax,y:ay,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:.9,life:rnd(.35,.7),size:rnd(1.6,3),type:'streak',color:Math.random()<.5?T0.ray:T0.main}); }
  for (let i=0;i<P*.6;i++){ const a = rnd(0,7), v = rnd(200,800); spawn({x:ax,y:ay,vx:Math.cos(a)*v,vy:Math.sin(a)*v-200,g:600,drag:.95,life:rnd(.6,1.3),size:rnd(2,4.5),color:T0.ray}); }
  for (let i=0;i<P*.18;i++){ const a = rnd(0,7), v = rnd(150,600); spawn({x:ax,y:ay,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:.93,life:rnd(.8,1.5),size:rnd(6,12),type:'star',vr:rnd(2,5),color:T0.ray}); }
  for (let i=0;i<P*.22;i++){ const a = rnd(-Math.PI*.95,-Math.PI*.05), v = rnd(400,900); spawn({x:ax,y:ay-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:1500,drag:.985,life:rnd(1.2,1.8),size:rnd(9,13),type:'coin',vr:rnd(6,14)}); }
  for (let i=0;i<P*.1;i++){ const a = rnd(-Math.PI*.9,-Math.PI*.1), v = rnd(400,850); spawn({x:ax,y:ay-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:1400,drag:.985,life:rnd(1.2,1.8),size:rnd(9,13),type:'gem',vr:rnd(5,10),color:['#ff5c9a','#4dc3ff','#7dff8a','#c46bff'][i%4]}); }
  if (tier === 3) for (let i=0;i<CONFIG.confetti*PMUL;i++){ const a = rnd(-Math.PI*.85,-Math.PI*.15), v = rnd(600,1200);
    spawn({x:ax,y:ay,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:700,drag:.96,life:rnd(2,3),size:rnd(5,8),type:'confetti',vr:rnd(-10,10),color:['#ff4d6d','#ffc23a','#4dc3ff','#7dff8a','#c46bff','#fff'][i%6]}); }
  beamsOn(); gsap.to('#glow', {opacity:1, scale:1.15, duration:.4, overwrite:true});
  gsap.delayedCall(1.05, ()=> tier===3 ? heroReveal() : toCards());
}
function heroReveal(){
  window.__phase = 'reveal'; state = 'busy';
  gsap.to('#curtain', {opacity:1, duration:.45, ease:'power2.out'});
  gsap.to('#tier', {opacity:0, duration:.3});
  gsap.delayedCall(.12, ()=>{ chest.visible = false; shadow.visible = false; hero.visible = true; anim.heroS = .01; hero.rotation.y = 0; updateAnchor(true);
    anim.heroSpin = 14; gsap.to(anim, {heroSpin:.7, duration:1.6, ease:'power3.out'});
    gsap.to(anim, {heroS:1, duration:.9, ease:'elastic.out(1,.5)'});
    flash(.5, .6); ring(anchor.x, anchor.y, heroR*.5, heroR*3, .8, '#fff1a0'); SFX.fanfare();
    slam('传说降临！');
    for (let i=0;i<CONFIG.orbitStars;i++) spawn({mode:'orbit', type:'orbit', ang:i/CONFIG.orbitStars*Math.PI*2, w:1.6, flat:.92, trail:[], life:1, color:i%2?'#fff1a0':'#ffb0e0'});
  });
  gsap.fromTo('#panel', {opacity:0, y:60, scale:.8}, {opacity:1, y:0, scale:1, duration:.6, delay:.9, ease:'back.out(2)', onStart:()=>SFX.pop()});
  [[8650,12880,''],[12,18,'%'],[30,55,'']].forEach(([a,b,u],i)=>{ const el = $('#s'+i), up = $('#u'+i), o = {v:a}; el.textContent = a+u; up.style.opacity = 0;
    gsap.to(o, {v:b, duration:1.2, delay:1.3+i*.25, ease:'power2.out', onUpdate(){ const t = Math.round(o.v)+u; if (el.textContent!==t){ el.textContent = t; SFX.tick(); } },
      onComplete(){ up.textContent = '▲+'+(b-a)+u; gsap.fromTo(up, {opacity:0, y:10, scale:.5}, {opacity:1, y:0, scale:1, duration:.45, ease:'back.out(3)'}); gsap.fromTo(el, {scale:1.3}, {scale:1, duration:.4, ease:'elastic.out(1,.4)'}); SFX.pop(); }}); });
  gsap.delayedCall(2.5, ()=>{ state = 'hero'; window.__phase = 'hero'; showAct('收下', ()=>{ state='busy'; leaveHero(); }); });
}
function leaveHero(){
  for (let i=parts.length-1;i>=0;i--) if (parts[i].mode==='orbit') parts.splice(i,1);
  gsap.to('#panel', {opacity:0, y:40, duration:.3});
  gsap.to(anim, {heroS:.01, duration:.3, ease:'back.in(2)', onComplete(){ hero.visible = false; chest.visible = true; shadow.visible = true; updateAnchor(true); }});
  gsap.to('#curtain', {opacity:0, duration:.4, delay:.2});
  gsap.to('#tier', {opacity:1, duration:.3, delay:.3});
  gsap.delayedCall(.45, ()=>{ slam(TIERS[3].name); toCards(); });
}
function toCards(){
  state = 'busy'; window.__phase = 'cards';
  cardOut().add(()=>{ state = 'claim'; window.__phase = 'claim'; showAct('全部领取', claim); }, '+=0.1');
}
function bump(sel){ gsap.fromTo(sel, {scale:1.25}, {scale:1, duration:.35, ease:'elastic.out(1,.4)', overwrite:true}); }
function claim(){
  state = 'busy'; window.__phase = 'claiming';
  const tc = $('#pCoin svg').getBoundingClientRect(), tg = $('#pGem svg').getBoundingClientRect();
  let pending = 0;
  cardEls.forEach((el,i)=>{
    const it = el._it, c = el._c;
    gsap.to(el, {y:'-=30', scale:.6, opacity:0, duration:.4, delay:.15+i*.08, ease:'back.in(2)'});
    if (it.k!=='coin' && it.k!=='gem') return;
    const tgt = it.k==='coin'? tc : tg, n = Math.round(CONFIG.coinFly*(REDUCED?.5:1)), per = it.n/n;
    for (let j=0;j<n;j++){ pending++;
      gsap.delayedCall(i*.08 + j*.045, ()=>{ const ex = tgt.left+tgt.width/2, ey = tgt.top+tgt.height/2, sx = c.x+rnd(-20,20), sy = c.y+rnd(-20,20);
        spawn({mode:'curve', type:it.k, t:0, dur:rnd(.6,.85), size:10, vr:10, color:'#ff5c9a', life:1,
          p:[sx,sy, sx+rnd(-160,160),sy-rnd(80,240), ex+rnd(-120,40),ey+rnd(60,200), ex,ey],
          onArrive(){ bal[it.k] += per; $(it.k==='coin'?'#vCoin':'#vGem').textContent = Math.round(bal[it.k]); bump(it.k==='coin'?'#pCoin':'#pGem'); SFX.coin();
            sparkRingAt(ex, ey, 4, 160, it.k==='coin'?'#ffe27a':'#ffb0d0'); if (--pending===0) settle(); }}); });
    }
  });
  if (!pending) gsap.delayedCall(.6, settle);
}
function settle(){
  bal.coin = Math.round(bal.coin); bal.gem = Math.round(bal.gem); $('#vCoin').textContent = bal.coin; $('#vGem').textContent = bal.gem;
  beamsOff(.6); gsap.to('#glow', {opacity:.55, scale:1, duration:.6, overwrite:true}); anim.glow = 0;
  gsap.to(anim, {lid:0, duration:.5, ease:'bounce.out', delay:.3});
  stopAllShakes();
  gsap.delayedCall(.4, ()=>{ slam('奖励到手！'); SFX.chord(3); });
  gsap.delayedCall(1, ()=>{ $('#cards').innerHTML = ''; cardEls = []; state = 'done'; window.__phase = 'done'; showAct('再开一箱', resetAll); });
}
function resetAll(){
  state = 'busy';
  gsap.to(anim, {idleW:1, duration:.6, ease:'power2.inOut'});
  setTier(0); setHint(mode==='step'?'点击宝箱升级':'点击直接开启');
  gsap.delayedCall(.6, ()=>{ state = 'idle'; window.__phase = 'idle'; startIdleLoops(); });
}

/* ================= input ================= */
app.addEventListener('pointerdown', e=>{
  if (e.target.closest('#hud') || e.target.closest('#act')) return;
  initAudio(); if (AC && AC.state==='suspended') AC.resume();
  if (state !== 'idle') return;
  if (mode==='step' && tier<3) upgrade(); else openChest();
});
function setMode(m){ if (state!=='idle'){ gsap.fromTo('.mbtn',{x:-4},{x:0,duration:.3,ease:'elastic.out(1,.3)'}); return; }
  mode = m; $('#mStep').classList.toggle('on', m==='step'); $('#mDirect').classList.toggle('on', m==='direct');
  setHint(m==='step' ? (tier<3?'点击宝箱升级':'点击开启宝箱') : '点击直接开启'); }
$('#mStep').addEventListener('pointerdown', e=>{ e.stopPropagation(); initAudio(); setMode('step'); });
$('#mDirect').addEventListener('pointerdown', e=>{ e.stopPropagation(); initAudio(); setMode('direct'); });

/* ================= main loop ================= */
let last = performance.now(), time = 0;
function frame(now){
  const dt = Math.min(TEST?.1:.05, Math.max(0,(now-last)/1000))*gsap.globalTimeline.timeScale(); last = now; time += dt;
  const c = anim.charge, jit = c*c*0.09*CONFIG.chargeShake;
  chest.rotation.y = Math.sin(time*.7)*CONFIG.idleSway*anim.idleW + anim.spin;
  chest.position.set(rnd(-1,1)*jit, (Math.sin(time*1.8)*CONFIG.idleBob + CONFIG.idleBob*1.5)*anim.idleW + anim.jy, rnd(-1,1)*jit*.5);
  chest.rotation.z = anim.wiggle + rnd(-1,1)*jit*.5;
  squash.scale.set(anim.sx, anim.sy, anim.sx);
  lid.rotation.x = anim.lid - c*.1 - (c>0 ? Math.random()*c*.08 : 0);
  const gl = Math.min(1, Math.max(c*1.8, anim.glow)); for (const m of innerMats) m.color.copy(innerDark).lerp(innerHot, gl);
  const h = chest.position.y; shadow.scale.setScalar(Math.max(.4, 1 - h*.28)); shadow.material.opacity = Math.max(.15, .9 - h*.35);
  hero.scale.setScalar(Math.max(.01, anim.heroS)*HERO_S); hero.rotation.y += dt*anim.heroSpin; hero.position.y = HERO_Y + Math.sin(time*1.5)*.05;
  camera.position.z = camBaseZ*anim.camZ; camera.updateMatrixWorld();
  updateAnchor(false);
  camera.layers.set(0); renderer.setRenderTarget(colorRT); renderer.clear(); renderer.render(scene, camera);
  camera.layers.set(1); scene.overrideMaterial = normMat; renderer.setRenderTarget(normRT); renderer.clear(); renderer.render(scene, camera); scene.overrideMaterial = null;
  camera.layers.set(0); renderer.setRenderTarget(null); renderer.clear(); renderer.render(postScene, postCam);
  updateParticles(dt); drawParticles();
  requestAnimationFrame(frame);
}
if (TEST) gsap.ticker.lagSmoothing(0);
// 测试钩子：window.__holds=[{phase:'burst',delay:.15}] 时在该阶段指定时刻冻结时间以便截图
{ let _ph='idle'; Object.defineProperty(window,'__phase',{configurable:true,get(){return _ph;}, set(v){ _ph=v; const q=window.__holds; if(q && q.length && q[0].phase===v){ const h=q.shift(); gsap.delayedCall(h.delay||0, ()=>{ gsap.globalTimeline.timeScale(0); window.__held=v; }); } }}); }
addEventListener('resize', resize);
resize(); setTier(0); setHint('点击宝箱升级'); startIdleLoops(); window.__phase = 'idle';
requestAnimationFrame(frame);
</script>
</body>
